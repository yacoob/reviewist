[tools]
node = "22"

[tasks.dev]
run = "npx vite"
description = "Start Vite dev server"

[tasks.build]
run = "npx vite build"
description = "Build single-file production HTML"

[tasks.check]
run = "npx svelte-check --tsconfig ./tsconfig.json"
description = "Run svelte-check type diagnostics"

[tasks.lint]
run = "npx eslint src/"
description = "Run ESLint on source files"

[tasks.clean]
run = "rm -rf dist node_modules/.vite"
description = "Remove build outputs and Vite cache"

[tasks.raze]
run = "rm -rf dist node_modules"
description = "Remove all local/generated files, leaving only tracked sources"
