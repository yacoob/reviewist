[hooks]
enter = [
  "jj config set --repo 'revset-aliases.\"immutable_heads()\"' 'present(trunk()) & committer_date(before:\"7 days ago\")'",
  "mise i -q",
  "pnpm i -q",
]

[tools]
node = "22"
pnpm = "latest"

[tasks.clean]
run = "rm -rf dist node_modules/.vite"
description = "Remove build outputs and Vite cache"

[tasks.raze]
run = "rm -rf dist node_modules coverage"
description = "Remove all local/generated files, leaving only tracked sources"
