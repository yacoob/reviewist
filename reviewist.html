<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviewist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-2: #1c1c1f;
    --surface-3: #242428;
    --border: #2a2a2e;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --text-muted: #52525b;
    --accent: #e44332;
    --accent-dim: rgba(228, 67, 50, 0.15);
    --green: #4caf50;
    --green-dim: rgba(76, 175, 80, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .container {
    max-width: 740px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
  }

  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .header-right {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .refresh-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
  }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 0.3rem 0.5rem;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--text-muted); }

  /* Setup panel — collapsible */
  .setup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    display: none;
  }
  .setup.visible { display: block; }

  .setup-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field.grow { flex: 1; min-width: 200px; }

  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input, select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.5rem 0.65rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="password"] { letter-spacing: 0.1em; }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: var(--surface-3);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }
  .btn-small { font-size: 0.65rem; padding: 0.3rem 0.6rem; }

  /* Status */
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.6rem 0.85rem;
    border-radius: 5px;
    margin-bottom: 1.25rem;
  }
  .status.error {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(228, 67, 50, 0.25);
  }
  .status.info {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(76, 175, 80, 0.2);
  }
  .status.loading {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  /* Project filters — multi-toggle */
  .filters {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  /* Day groups */
  .day-group { margin-bottom: 1.75rem; }

  .day-header {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    padding-bottom: 0.5rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .day-count {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 0.65rem;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.45rem 0;
    font-size: 0.85rem;
  }

  .task-check {
    color: var(--green);
    font-size: 0.75rem;
    margin-top: 0.15rem;
    flex-shrink: 0;
  }

  .task-content { flex: 1; color: var(--text); }

  .task-meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-shrink: 0;
  }

  a.task-project {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
    background: var(--surface-2);
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
    text-decoration: none;
  }
  a.task-project:hover { text-decoration: underline; }

  .task-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .task-time[title] { cursor: help; text-decoration: underline dotted var(--text-muted); }

  .task-labels { display: inline-flex; gap: 0.25rem; }
  a.task-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
    background: var(--surface-2);
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
    text-decoration: none;
  }
  a.task-label:hover { text-decoration: underline; }

  .task-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
    background: var(--surface-3);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
  }

  /* Empty / needs-token states */
  .empty, .needs-token {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .needs-token .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    margin-top: 0.5rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .setup-row { flex-direction: column; }
    .field.grow { min-width: 100%; }
    .task-item { flex-wrap: wrap; }
    .task-meta { margin-left: 1.35rem; }
  }

  /* Print */
  @media print {
    body { background: white; color: black; }
    .setup, .header-right, button { display: none !important; }
    .filters { display: none; }
    .day-header { border-color: #ccc; color: #333; }
    .task-project { background: #eee; color: #555; }
    .task-check { color: #333; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>reviewist</h1>
    <div class="header-right">
      <span class="refresh-indicator" id="refreshIndicator"></span>
      <button class="btn-icon" onclick="toggleSetup()" title="Settings">⚙</button>
    </div>
  </header>

  <div class="setup" id="setup">
    <div class="setup-row">
      <div class="field grow">
        <label>API Token</label>
        <input type="password" id="token" placeholder="Settings → Integrations → Developer" />
      </div>
      <div class="field">
        <label>From</label>
        <input type="date" id="since" />
      </div>
      <div class="field">
        <label>To</label>
        <input type="date" id="until" />
      </div>
      <button class="btn-primary" id="fetchBtn" onclick="manualFetch()">Fetch</button>
      <button class="btn-secondary btn-small" onclick="forgetToken()" title="Forget saved token">Forget</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="filters"></div>
  <div id="results"></div>
</div>

<script>
// ── Todoist color name → hex (from https://developer.todoist.com/api/v1#tag/Colors) ──
const TODOIST_COLORS = {
  berry_red: '#B8255F', red: '#DC4C3E', orange: '#C77100', yellow: '#B29104',
  olive_green: '#949C31', lime_green: '#65A33A', green: '#369307', mint_green: '#42A393',
  teal: '#148FAD', sky_blue: '#319DC0', light_blue: '#6988A4', blue: '#4180FF',
  grape: '#692EC2', violet: '#CA3FEE', lavender: '#A4698C', magenta: '#E05095',
  salmon: '#C9766F', charcoal: '#808080', grey: '#999999', taupe: '#8F7A69',
};

// ── State ──
let allTasks = [];
let projects = {}; // { id: { name, color } }
let excludedProjects = new Set();
let refreshTimer = null;
let lastFetchTime = null;

// ── Init ──
(function init() {
  const saved = localStorage.getItem('todoist_review_token');
  if (saved) document.getElementById('token').value = saved;

  // Restore excluded projects
  try {
    const exc = JSON.parse(localStorage.getItem('todoist_review_excluded') || '[]');
    excludedProjects = new Set(exc);
  } catch(e) {}

  // Default range: 6 weeks back
  const now = new Date();
  const sixWeeksAgo = new Date(now);
  sixWeeksAgo.setDate(sixWeeksAgo.getDate() - 42);
  document.getElementById('until').value = fmtDate(now);
  document.getElementById('since').value = fmtDate(sixWeeksAgo);

  if (saved) {
    // Has token → auto-fetch, hide setup, start refresh
    fetchCompleted();
    startRefresh();
  } else {
    // No token → show setup
    document.getElementById('setup').classList.add('visible');
    document.getElementById('results').innerHTML =
      '<div class="needs-token">Paste your API token to get started' +
      '<div class="hint">Settings → Integrations → Developer</div></div>';
  }
})();

// ── Utilities ──

function fmtDate(d) { return d.toISOString().split('T')[0]; }

function escHtml(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

// ── UI actions ──

function toggleSetup() {
  document.getElementById('setup').classList.toggle('visible');
}

function forgetToken() {
  localStorage.removeItem('todoist_review_token');
  localStorage.removeItem('todoist_review_excluded');
  document.getElementById('token').value = '';
  stopRefresh();
  showStatus('Token forgotten', 'info');
}

function showStatus(msg, type) {
  document.getElementById('status').innerHTML = `<div class="status ${type}">${msg}</div>`;
}

function clearStatus() {
  document.getElementById('status').innerHTML = '';
}

function updateIndicator() {
  const el = document.getElementById('refreshIndicator');
  if (!lastFetchTime) { el.textContent = ''; return; }
  const s = Math.round((Date.now() - lastFetchTime) / 1000);
  el.textContent = s < 5 ? 'just now' : s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ago`;
}
setInterval(updateIndicator, 10000);

// ── Auto refresh ──

function startRefresh() {
  stopRefresh();
  refreshTimer = setInterval(() => fetchCompleted(true), 60000);
}

function stopRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

// ── API ──

async function api(url, token) {
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
  return res.json();
}

async function fetchProjects(token) {
  const data = await api('https://api.todoist.com/api/v1/projects', token);
  const list = Array.isArray(data) ? data : (data.results || data);
  const map = {};
  if (Array.isArray(list)) list.forEach(p => { map[p.id] = { name: p.name, color: p.color || null }; });
  return map;
}

async function fetchCompletedTasks(token, since, until) {
  const sinceISO = new Date(since + 'T00:00:00').toISOString();
  const untilISO = new Date(until + 'T23:59:59').toISOString();

  // Try both param naming conventions
  for (const url of [
    `https://api.todoist.com/api/v1/tasks/completed?since=${sinceISO}&until=${untilISO}&limit=200`,
    `https://api.todoist.com/api/v1/tasks/completed?completed_after=${sinceISO}&completed_before=${untilISO}&limit=200`,
  ]) {
    try {
      const data = await api(url, token);
      const items = data.items || data.results || (Array.isArray(data) ? data : []);
      return { items };
    } catch(e) {}
  }

  throw new Error('Completed tasks endpoint failed. Check your token and Pro plan.');
}

// ── Main fetch ──

async function manualFetch() {
  const token = document.getElementById('token').value.trim();
  if (token) {
    localStorage.setItem('todoist_review_token', token);
    startRefresh();
  }
  await fetchCompleted();
  document.getElementById('setup').classList.remove('visible');
}

async function fetchCompleted(silent = false) {
  const token = document.getElementById('token').value.trim() ||
                localStorage.getItem('todoist_review_token');
  const since = document.getElementById('since').value;
  const until = document.getElementById('until').value;

  if (!token || !since || !until) {
    if (!silent) showStatus('Enter your API token', 'error');
    return;
  }

  const btn = document.getElementById('fetchBtn');
  if (!silent) { btn.disabled = true; btn.textContent = '...'; showStatus('Fetching...', 'loading'); }

  try {
    const [projMap, completedData] = await Promise.all([
      fetchProjects(token),
      fetchCompletedTasks(token, since, until)
    ]);

    projects = { ...projects, ...projMap };
    allTasks = completedData.items;
    lastFetchTime = Date.now();
    updateIndicator();
    clearStatus();

    if (allTasks.length === 0) {
      document.getElementById('filters').innerHTML = '';
      document.getElementById('results').innerHTML =
        '<div class="empty"><div class="empty-icon">∅</div>No completed tasks in this range.</div>';
    } else {
      renderFilters();
      renderResults();
    }
  } catch(e) {
    if (!silent) {
      showStatus(e.message, 'error');
      document.getElementById('results').innerHTML = '';
      document.getElementById('filters').innerHTML = '';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch';
  }
}

// ── Rendering ──

function renderFilters() {
  const counts = {};
  allTasks.forEach(t => { counts[t.project_id] = (counts[t.project_id] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  document.getElementById('filters').innerHTML = '<div class="filters">' +
    sorted.map(([pid, count]) => {
      const p = projects[pid];
      const name = p ? p.name : (pid || '?');
      const hex = p && p.color ? (TODOIST_COLORS[p.color] || null) : null;
      const on = !excludedProjects.has(pid);
      let style, hover;
      if (on && hex) {
        style = `background:${hex}22;color:${hex};border-color:${hex}44`;
        hover = '';
      } else if (on) {
        style = '';
        hover = '';
      } else {
        style = 'opacity:0.45';
        if (hex) {
          hover = ` onmouseenter="this.style.opacity='0.75';this.style.background='${hex}11';this.style.color='${hex}88';this.style.borderColor='${hex}22'"` +
                  ` onmouseleave="this.style.opacity='0.45';this.style.background='';this.style.color='';this.style.borderColor=''"`;
        } else {
          hover = '';
        }
      }
      return `<span class="filter-chip" style="${style}"${hover} onclick="toggleProject('${pid}')">${escHtml(name)}</span>`;
    }).join('') + '</div>';
}

function toggleProject(pid) {
  if (excludedProjects.has(pid)) excludedProjects.delete(pid);
  else excludedProjects.add(pid);
  localStorage.setItem('todoist_review_excluded', JSON.stringify([...excludedProjects]));
  renderFilters();
  renderResults();
}

function renderResults() {
  const tasks = allTasks.filter(t => !excludedProjects.has(t.project_id));

  const grouped = {};
  tasks.forEach(t => {
    const date = (t.completed_at || '').split('T')[0] || 'Unknown';
    (grouped[date] = grouped[date] || []).push(t);
  });

  const days = Object.keys(grouped).sort().reverse();

  if (!days.length) {
    document.getElementById('results').innerHTML =
      '<div class="empty"><div class="empty-icon">∅</div>All projects filtered out.</div>';
    return;
  }

  document.getElementById('results').innerHTML = days.map(day => {
    const sorted = grouped[day].sort((a, b) => {
      const ta = a.completed_at || '';
      const tb = b.completed_at || '';
      return ta.localeCompare(tb);
    });

    // Deduplicate: group by content + project_id
    const deduped = [];
    const seen = {};
    sorted.forEach(t => {
      const key = (t.content || '') + '||' + (t.project_id || '');
      if (seen[key]) {
        seen[key].count++;
        seen[key].allTimes.push(t.completed_at || '');
        // Keep the latest timestamp as primary
        if ((t.completed_at || '') > (seen[key].completed_at || '')) {
          seen[key].completed_at = t.completed_at;
        }
      } else {
        const entry = { ...t, count: 1, allTimes: [t.completed_at || ''] };
        seen[key] = entry;
        deduped.push(entry);
      }
    });

    const label = day === 'Unknown' ? 'Unknown date' : formatDayLabel(day);

    return `<div class="day-group">
      <div class="day-header"><span>${label}</span><span class="day-count">${deduped.length}</span></div>
      ${deduped.map(t => {
        const p = projects[t.project_id];
        const projName = p ? p.name : '';
        const projHex = p && p.color ? (TODOIST_COLORS[p.color] || null) : null;
        const projStyle = projHex
          ? `background:${projHex}22;color:${projHex};border:1px solid ${projHex}44`
          : '';
        const latestTime = (t.completed_at || '').split('T')[1]?.slice(0, 5) || '';
        const rawContent = t.content || t.task_id || '?';
        const inlineLabels = (rawContent.match(/@\w+/g) || []).map(l => l.slice(1));
        const content = rawContent.replace(/@\w+/g, '').replace(/\s{2,}/g, ' ').trim();
        const labels = [...new Set([...inlineLabels, ...(t.labels || [])])];
        const countBadge = t.count > 1
          ? `<span class="task-count">×${t.count}</span>`
          : '';
        const otherTimes = t.allTimes
          .map(ts => ts.split('T')[1]?.slice(0, 5) || '?')
          .sort()
          .join(', ');
        const timeTooltip = t.count > 1 ? ` title="${otherTimes}"` : '';
        return `<div class="task-item">
          <span class="task-check">✓</span>
          <span class="task-content">${escHtml(content)}</span>
          <div class="task-meta">
            ${countBadge}
            ${labels.length ? `<span class="task-labels">${labels.map(l => `<a href="https://app.todoist.com/app/label/${encodeURIComponent(l)}" target="_blank" class="task-label">@${escHtml(l)}</a>`).join('')}</span>` : ''}
            ${projName ? `<a href="https://app.todoist.com/app/project/${t.project_id}" target="_blank" class="task-project" ${projStyle ? `style="${projStyle}"` : ''}>${escHtml(projName)}</a>` : ''}
            ${latestTime ? `<span class="task-time"${timeTooltip}>${latestTime}</span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function formatDayLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const now = new Date();
  const today = fmtDate(now);
  const yd = new Date(now); yd.setDate(yd.getDate() - 1);
  const yesterday = fmtDate(yd);

  const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
  const month = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  if (dateStr === today) return `${month} · Today`;
  if (dateStr === yesterday) return `${month} · Yesterday`;
  return `${month} · ${weekday}`;
}
</script>
</body>
</html>
